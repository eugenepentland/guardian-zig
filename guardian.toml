spec_file = "SPEC.md"
file_size_exclude = []

# Baseline mode: instead of raising thresholds project-wide (which removes
# protection from ALL new code), run every check at its framework default and
# freeze Guardian's current offenders in .guardian/baselines/. New code is held
# to the strict default; the frozen set is a ratchet to shrink over time
# (refactor a state machine, run GUARDIAN_UPDATE_SNAPSHOT=1, commit the smaller
# baseline). Downstream consumers get the same clean default thresholds.
[baseline]
enabled = true

# Spec modules must not depend on config or analysis — only check.zig bridges them
[[boundary]]
module = "src/spec/*"
forbidden = ["config"]

# Self-hosting: enforce that every pub fn is referenced from a test. Entry
# points (main), CLI/build integration (printHelp, addAllChecks), env/IO
# wrappers around already-tested pure logic (parseFile, scanDir,
# collectModules, shouldUpdate), the ban-family orchestration shell (scan),
# baseline orchestration (runWithBaseline), and reporter output (fail,
# detail, emit) are exempt.
[test_coverage]
enabled = true
exempt_names = ["main", "printHelp", "addAllChecks", "runWithBaseline", "shouldUpdate", "parseFile", "scanDir", "collectModules", "scan", "fail", "detail", "emit"]
