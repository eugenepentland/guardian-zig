spec_file = "SPEC.md"
file_size_exclude = []

# Guardian passes every check at its framework defaults with zero violations —
# no baseline, no raised thresholds. Baseline mode ([baseline] enabled = true)
# stays available for downstream projects adopting Guardian on legacy code.

# Spec modules must not depend on config or analysis — only check.zig bridges them
[[boundary]]
module = "src/spec/*"
forbidden = ["config"]

# The reporter is Guardian's printf-style logging boundary and golden_runner is
# a generic test harness — variadic `anytype` is the idiomatic mechanism there,
# not the untyped-generics smell the budget targets. Exempt both.
[anytype_budget]
exclude = ["reporter.zig", "testing/golden_runner.zig"]

# Config is a flat settings aggregation (one field per knob), not a "god struct"
# doing too much — the type-size smell doesn't apply. Exempt it.
[type_size]
exclude = ["config.zig"]

# magic-number is opt-in (off by default) because it's pure noise in literal-heavy
# domains. Guardian's own code passes it, so enable it here to keep dogfooding.
[magic_number]
enabled = true

# Guardian's own self-hosting exemptions. These used to be compiled into each
# check's source, which silently punched the same holes into any downstream repo
# sharing those paths. Moving them here keeps the checks honest for consumers and
# makes the count of exemptions a visible FP-rate / refactor-debt signal.

# Guardian is a static analyzer: it walks the filesystem and reads env by design.
[[allow]]
check = "ban-fs"
paths = ["src/walk*", "src/cache*", "src/snapshot*", "src/config*", "src/spec/parser*", "src/checks/spec_init*", "src/checks/dead_pub*", "src/testing/*", "src/baseline.zig"]

[[allow]]
check = "ban-env"
paths = ["src/snapshot_helper*", "src/testing/*"]

# reporter is Guardian's logging boundary; it legitimately owns a global + prints.
[[allow]]
check = "ban-globals"
paths = ["src/reporter.zig"]

[[allow]]
check = "debug-print-ban"
paths = ["src/ast/parser*", "src/snapshot.zig", "src/snapshot_helper*", "src/baseline.zig", "src/reporter.zig"]

# This check's own file: its pattern strings look like the paths it flags.
[[allow]]
check = "ban-hardcoded-paths"
paths = ["src/checks/ban_hardcoded_paths*"]

[[allow]]
check = "static-factory-ban"
paths = ["src/build_helper.zig", "src/reporter.zig"]

# Refactor debt: many token-walk files dispatch the same internal enums.
[[allow]]
check = "repeated-switch-on-enum"
paths = ["src/checks/*", "src/ast/*", "src/spec/*", "src/snapshot.zig", "src/snapshot_helper.zig"]

# Self-hosting: enforce that every pub fn is referenced from a test. Entry
# points (main), CLI/build integration (printHelp, addAllChecks), env/IO
# wrappers around already-tested pure logic (parseFile, scanDir,
# collectModules, shouldUpdate), the ban-family orchestration shell (scan),
# baseline orchestration (runWithBaseline), and reporter output (fail,
# detail, emit) are exempt.
[test_coverage]
enabled = true
exempt_names = ["main", "printHelp", "addAllChecks", "runWithBaseline", "shouldUpdate", "parseFile", "scanDir", "collectModules", "scan", "fail", "detail", "emit"]
