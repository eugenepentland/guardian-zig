spec_file = "SPEC.md"
file_size_exclude = []

# Guardian passes every check at its framework defaults with zero violations —
# no baseline, no raised thresholds. Baseline mode ([baseline] enabled = true)
# stays available for downstream projects adopting Guardian on legacy code.

# Spec modules must not depend on config or analysis — only check.zig bridges them
[[boundary]]
module = "src/spec/*"
forbidden = ["config"]

# The reporter is Guardian's printf-style logging boundary and golden_runner is
# a generic test harness — variadic `anytype` is the idiomatic mechanism there,
# not the untyped-generics smell the budget targets. Exempt both.
[anytype_budget]
exclude = ["reporter.zig", "testing/golden_runner.zig"]

# Config is a flat settings aggregation (one field per knob), not a "god struct"
# doing too much — the type-size smell doesn't apply. Exempt it. cli/types.zig
# holds RunCtx, the per-invocation context bag threaded through every check
# (allocator, dirs, cfg, diff base, mutate tier, --only/--skip filters) — the
# same flat-aggregation case, not a god struct. Exempt it too. reporter.zig
# holds Violation, the flat diagnostic record: check, file, line, message,
# fix_hint, identity, ratchet_key, metric are eight independent facets of one
# finding, each read by a different consumer (terminal render, baseline v3 key,
# ratchet v2 aggregation, JSONL sink) — the same flat-aggregation case again.
[type_size]
exclude = ["config.zig", "cli/types.zig", "reporter.zig"]

# Guardian's test binary is rooted at src/check.zig (build.zig's
# root_source_file), not the conventional src/main.zig or src/root.zig, so the
# default heuristic would find no root and skip. Naming it here is what makes
# the check bite on Guardian itself: every file with a `test` block must be
# reachable from check.zig's aggregator, or its tests never compile.
[test_reachability]
# test_runner.zig is its own test root: build.zig compiles it as a second test
# binary (a runner file cannot also be imported by the module under test).
roots = ["src/check.zig", "src/test_runner.zig"]

# magic-number is opt-in (off by default) because it's pure noise in literal-heavy
# domains. Guardian's own code passes it, so enable it here to keep dogfooding.
[magic_number]
enabled = true

# Mutation is adopted as a measured ratchet. The permissive percentage is only
# the bootstrap floor; `.guardian/mutation.txt` records the exact full-cohort
# score and prevents any regression from that measured baseline.
[mutation]
min_score_pct = 40
min_mutants = 4
max_mutants = 100
fast_max_mutants = 8
timeout_retry_multiplier = 2
retained_cache_suites = 3

# oom-discipline is opt-in: it flags allocation errors dropped by a swallowing
# catch (`alloc catch return <benign>` / `catch continue` / `catch break`),
# which fail the gate open. A hard gate must fail closed on OOM, so guardian
# dogfoods it — every gate-relevant path propagates allocation failure.
[oom_discipline]
enabled = true

# fuzz-presence is opt-in: each listed module must keep a std.testing.fuzz
# harness. Guardian's hand-rolled scanners eat untrusted text, so dogfood the
# check on exactly the three cores that carry fuzz harnesses (see the README
# "Fuzzing" section). A refactor that drops one of these harnesses reds the gate.
[fuzz_presence]
modules = ["src/config_parser.zig", "src/walk.zig", "src/text.zig"]

# Guardian's own [[ban]] rule — the config-side ban the `ban` check enforces.
# A gate check must report and return error.CheckFailed: reporter.fatal exits the
# process on the spot, so every later check is skipped and `all` never prints the
# run-all verdict line the whole output contract is built on. spec_init is a
# generator command rather than a gate (nothing runs after it), so it keeps its
# aborts. Green today — this rule freezes that.
[[ban]]
chain = ["reporter", "fatal"]
paths = ["src/checks/"]
allow = ["src/checks/spec_init.zig"]
reason = "reporter.fail(...) then `return error.CheckFailed`, so the run finishes and reports"

# Guardian's own self-hosting exemptions. These used to be compiled into each
# check's source, which silently punched the same holes into any downstream repo
# sharing those paths. Moving them here keeps the checks honest for consumers and
# makes the count of exemptions a visible FP-rate / refactor-debt signal.

# Guardian is a static analyzer: it walks the filesystem and reads env by design.
# The mutation runner additionally splices/restores source files in place.
# change-classification reads the working-tree SPEC.md to detect added behavior
# bullets — the unstaged new side isn't in git's object store, so it reads disk.
# completeness reads SPEC.md directly (raw bullets incl. waivers); the DORA sink
# appends its JSONL delivery-telemetry file.
# install-hook writes .git/hooks/pre-commit (createFile/makePath/readFileAlloc)
# — the same static-analyzer-writes-files category as spec_init.
[[allow]]
check = "ban-fs"
paths = ["src/walk*", "src/cache*", "src/snapshot*", "src/config*", "src/required_inputs*", "src/missing_inputs*", "src/metadata_transaction*", "src/spec/parser*", "src/checks/spec_init*", "src/checks/dead_pub*", "src/checks/change_classification*", "src/checks/completeness*", "src/checks/fuzz_presence*", "src/testing/*", "src/cli/debt*", "src/cli/doctor*", "src/cli/install_hook*", "src/baseline.zig", "src/ratchet.zig", "src/mutation/*", "src/sink*", "src/dora*"]

# Delivery telemetry is guardian's one legitimate wall-clock consumer: the DORA
# sink times each gate run with std.time.Timer to record duration_ms. The bench
# ledger is the second: `bench set` stamps each recorded measurement with the
# calendar day it was taken (std.time.timestamp; the epoch->ISO conversion
# itself is pure in src/benchmark.zig). This repo-local allow does not propagate
# to consumers.
[[allow]]
check = "ban-time"
paths = ["src/dora*", "src/cli/bench*"]

# check.zig reads GUARDIAN_MUTATION_RUN / GUARDIAN_AGAINST /
# GUARDIAN_POLICY_APPROVED in main; the
# mutation runner clones the env to inject the child-build skip flag; commit
# clones the env to set GUARDIAN_SKIP_CHECKS on its `zig build test` child.
# The test runner is a process entry point (its own main) and reads
# GUARDIAN_TEST_ALLOW_EMPTY there — the env is the only channel a test binary
# spawned by the build system has.
[[allow]]
check = "ban-env"
paths = ["src/snapshot_helper*", "src/testing/*", "src/check.zig", "src/mutation/*", "src/cli/commit*", "src/test_runner.zig"]

# reporter is Guardian's logging boundary; it legitimately owns a global + prints.
# The mutation journal owns process-global in-flight state because a signal
# handler (its SIGINT/SIGTERM revert) takes no context argument — the catchable-
# signal analog of the SIGKILL-recovery journal, same category as the reporter
# singleton. The test runner is the `src/main*` case under a different name: its
# log counter, argv arena, protocol buffers and fuzz flag are process-lifetime
# singletons of an entry point (the stock Zig runner carries the same five).
[[allow]]
check = "ban-globals"
paths = ["src/reporter.zig", "src/mutation/journal.zig", "src/test_runner.zig"]

# reporter.zig defines the fatal helper (reporter.fatal), so its own
# std.process.exit(1) is the one sanctioned raw exit outside the pub-fn-main
# entry file (check.zig, which fatal-exit auto-detects via `fn main`).
[[allow]]
check = "fatal-exit"
paths = ["src/reporter.zig"]

# SeededRandom is the injection point ban-rng exists to force: the fake IS the
# deterministic Random a test puts behind the port, so its one
# std.Random.DefaultPrng.init call is legitimate here (and only here). The other
# fakes (clock/fs/env) are pure in-memory and need no allow.
[[allow]]
check = "ban-rng"
paths = ["src/fakes/*"]

# The mutation cache/report sinks (src/mutation/cache.zig, report.zig) log
# best-effort I/O failures with std.log.warn, like sink/dora.
[[allow]]
check = "debug-print-ban"
paths = ["src/ast/parser*", "src/snapshot.zig", "src/snapshot_helper*", "src/baseline.zig", "src/ratchet.zig", "src/reporter.zig", "src/sink*", "src/dora*", "src/mutation/*"]

# This check's own file: its pattern strings look like the paths it flags.
# install_hook embeds a POSIX pre-commit shell script (#!/bin/sh, /dev/null,
# ./zig-out/bin/guardian-check) as a string template — paths in a shell snippet,
# not environment assumptions baked into Zig logic.
[[allow]]
check = "ban-hardcoded-paths"
paths = ["src/checks/ban_hardcoded_paths*", "src/cli/install_hook*"]

[[allow]]
check = "static-factory-ban"
paths = ["src/build_helper.zig", "src/reporter.zig"]

# Refactor debt: many token-walk files dispatch the same internal enums.
# ratchet.zig shares snapshot read-error dispatch (Missing/VersionMismatch) with
# baseline.zig; the two init semantics genuinely differ (create/migrate vs
# create/refresh), so the switch is not foldable.
[[allow]]
check = "repeated-switch-on-enum"
paths = ["src/checks/*", "src/ast/*", "src/spec/*", "src/snapshot.zig", "src/snapshot_helper.zig", "src/ratchet.zig"]

# Self-hosting: enforce that every pub fn is referenced from a test. Entry
# points (main), CLI/build integration (printHelp, addAllChecks), env/IO
# wrappers around already-tested pure logic (parseFile, scanDir,
# collectModules, shouldUpdate, shouldUpdateFor, refreshTargets — the pure
# classify/refreshIncludes cores are tested), config validation shell
# (validateSelectiveConfig — validateDenyGrowth is tested), the ban-family
# orchestration shell (scan), baseline orchestration (runWithBaseline),
# reporter output (fail, detail, emit) and the noreturn fatal path (fatal —
# it exits the process, so it cannot be called from a test), and the
# git/mutation process shells (diffAgainst, untrackedFiles, fileAtHead, runOne,
# parentCount, changedPaths, addPaths, commit, headHash, currentBranch — their
# pure cores countParents/parsePorcelainZ are tested) are exempt.
# measureBaseline spawns a real `zig build test` to time the clean suite;
# install (sigaction on SIGINT/SIGTERM) and trackChild (an atomic store the
# signal handler reads) are OS-side-effect shells with no pure logic to assert —
# the same untestable-process-shell category as runOne/commit/currentBranch.
# testRunner, announceFilters and addTestCompileProbe join addAllChecks as build
# integration: each needs a live *std.Build graph, so what is assertable about
# them (the runner path, the probe's step name and its lack of filters) is
# tested as constants instead.
# fuzz is what `std.testing.fuzz` dispatches to in the test runner's root
# module — std calls it, no Guardian code can.
[test_coverage]
enabled = true
exempt_names = ["main", "printHelp", "addAllChecks", "runWithBaseline", "shouldUpdate", "shouldUpdateFor", "refreshTargets", "validateSelectiveConfig", "parseFile", "scanDir", "collectModules", "scan", "fail", "detail", "emit", "measure", "fatal", "diffAgainst", "untrackedFiles", "fileAtHead", "runOne", "parentCount", "changedPaths", "addPaths", "commit", "headHash", "currentBranch", "hooksDir", "measureBaseline", "install", "trackChild", "testRunner", "announceFilters", "addTestCompileProbe", "fuzz"]
