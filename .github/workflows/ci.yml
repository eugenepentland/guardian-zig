name: CI

on:
  push:
    branches: [main]
  pull_request:
  workflow_dispatch:

permissions:
  contents: read

jobs:
  test:
    name: Zig ${{ matrix.zig-version }}
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      matrix:
        zig-version: [0.15.0, 0.15.1]
    steps:
      - uses: actions/checkout@df4cb1c069e1874edd31b4311f1884172cec0e10 # v6
        with:
          fetch-depth: 0
      - uses: mlugg/setup-zig@d1434d08867e3ee9daa34448df10607b98908d29 # v2.2.1
        with:
          version: ${{ matrix.zig-version }}
      - run: ./scripts/check-release-metadata.sh
      - run: zig build test

  mutate-changes:
    name: Mutation test changed lines
    if: github.event_name == 'pull_request'
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@df4cb1c069e1874edd31b4311f1884172cec0e10 # v6
        with:
          fetch-depth: 0
      - uses: mlugg/setup-zig@d1434d08867e3ee9daa34448df10607b98908d29 # v2.2.1
        with:
          version: 0.15.1
      - run: ./scripts/check-release-metadata.sh
      - run: zig build test
      - run: zig build mutate
        env:
          GUARDIAN_AGAINST: origin/${{ github.base_ref }}
