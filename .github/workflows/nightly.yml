name: Nightly assurance

on:
  schedule:
    - cron: "17 2 * * *"
  workflow_dispatch:

permissions:
  contents: read

jobs:
  mutation:
    runs-on: ubuntu-latest
    timeout-minutes: 90
    steps:
      - uses: actions/checkout@df4cb1c069e1874edd31b4311f1884172cec0e10 # v6
        with:
          fetch-depth: 0
      - uses: mlugg/setup-zig@d1434d08867e3ee9daa34448df10607b98908d29 # v2.2.1
        with:
          version: 0.15.1
      - run: zig build test
      - run: zig build mutate-full

  fuzz-smoke:
    name: Fuzz ${{ matrix.filter }}
    runs-on: ubuntu-latest
    timeout-minutes: 30
    strategy:
      fail-fast: false
      matrix:
        filter:
          - "fuzz: guardian.toml parser"
          - "fuzz: wildcard matcher"
          - "fuzz: TestScope tracker"
    steps:
      - uses: actions/checkout@df4cb1c069e1874edd31b4311f1884172cec0e10 # v6
      - uses: mlugg/setup-zig@d1434d08867e3ee9daa34448df10607b98908d29 # v2.2.1
        with:
          version: 0.15.1
      - name: Fuzz configured harnesses for 60 seconds
        shell: bash
        run: |
          set +e
          timeout --signal=INT 60s zig build test --fuzz -Dfuzz-filter="${{ matrix.filter }}"
          status=$?
          set -e
          # A healthy fuzz session is intentionally stopped by timeout. Any
          # earlier compiler/test failure retains its distinct non-timeout code.
          if [ "$status" -ne 124 ] && [ "$status" -ne 130 ]; then
            exit "$status"
          fi
